<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ORBIT">
  <!-- Maskable variant: the artwork is inset to ~76% so Android's adaptive-icon
       mask (which can crop up to 20% from every edge) never clips the mark. -->
  <defs>
    <radialGradient id="msky" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#0d2140"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="mrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4f85" stop-opacity="0"/>
      <stop offset="45%" stop-color="#4d9bff"/>
      <stop offset="75%" stop-color="#cfeaff"/>
      <stop offset="100%" stop-color="#2a6bb0" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="msurf" cx="70%" cy="12%" r="90%">
      <stop offset="0%" stop-color="#245a8c"/>
      <stop offset="45%" stop-color="#0b2340"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#msky)"/>
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)">
    <g fill="#dce9ff">
      <circle cx="92" cy="96" r="3.5" opacity=".7"/>
      <circle cx="164" cy="58" r="2.4" opacity=".5"/>
      <circle cx="398" cy="88" r="3" opacity=".65"/>
      <circle cx="322" cy="46" r="2" opacity=".45"/>
      <circle cx="452" cy="156" r="2.6" opacity=".5"/>
    </g>
    <circle cx="256" cy="640" r="352" fill="none" stroke="url(#mrim)" stroke-width="16" opacity=".9"/>
    <circle cx="256" cy="640" r="344" fill="url(#msurf)"/>
    <g transform="translate(348 168)">
      <path d="M0 -58 C7 -47 11 -32 11 -18 L11 34 L-11 34 L-11 -18 C-11 -32 -7 -47 0 -58 Z" fill="#dbe8f8"/>
      <path d="M0 -58 C-7 -47 -11 -32 -11 -18 L-11 34 L0 34 Z" fill="#5a6d86"/>
      <path d="M-11 16 L-24 34 L-24 44 L-11 35 Z" fill="#33435a"/>
      <path d="M11 16 L24 34 L24 44 L11 35 Z" fill="#8fa5c0"/>
      <ellipse cx="0" cy="58" rx="13" ry="34" fill="#7dd3fc" opacity=".55"/>
      <ellipse cx="0" cy="48" rx="5" ry="18" fill="#ffffff" opacity=".9"/>
    </g>
