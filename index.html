<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ORBIT — GNC Flight Academy</title>
    <meta
      name="description"
      content="A local-first curriculum platform that takes a complete beginner to guidance, navigation and control engineering readiness. Runs entirely in your browser."
    />
    <meta name="theme-color" content="#000208" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ORBIT" />

    <style>
      /* Painted before React mounts so the first frame is never a white flash. */
      html,
      body {
        margin: 0;
        background: #000208;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000208;
        transition: opacity 0.4s ease;
        z-index: 100;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(77, 155, 255, 0.16);
        border-top-color: #4d9bff;
        border-radius: 50%;
        animation: bootspin 0.8s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
