# One-off helper: fetch public-domain / CC0 images from Wikimedia Commons on a
# GitHub runner and push them to an orphan branch. Used to source the desktop
# splash photo from an environment that cannot reach Commons directly.
name: Fetch Commons assets

on:
  push:
    branches: ['claude/spacex-gnc-curriculum-platform-hl8n5p']
    paths: ['.github/workflows/fetch-commons.yml']
  workflow_dispatch:
    inputs:
      titles:
        description: 'Commons file titles, one per line (no "File:" prefix)'
        required: false
        type: string
      branch:
        description: 'Orphan branch to push the files into'
        default: assets/splash-candidates
        type: string

permissions:
  contents: write

env:
  DEFAULT_TITLES: |
    Falcon_Heavy_Side_Boosters_landing_on_LZ1_and_LZ2_-_2018_(25254688767).jpg
    Falcon_Heavy_Demo_Mission_(40126461851).jpg
    Falcon_Heavy_Demo_Mission_(39337245145).jpg
    Falcon_Heavy_Demo_Mission_(40126461411).jpg
    First_Launch_of_SpaceX_Falcon_Heavy.jpg
    Plume_from_SpaceX_Launch_of_Iridium-4_Falcon_9_Flight_46.jpg
    Iridium-4_Mission_(38571300315).jpg
    Iridium-1_Launch_(32312419215).jpg
    CRS-8_(26239020092).jpg
    SpaceX_Starship_booster_landing_approach_IFT-5.jpg
    ORBCOMM-2_(23282658734).jpg
    Falcon_9_Flight_20_Launch_(23803406330).jpg
    Crew_Dragon_Demo-2_Launch_(NHQ202005300044).jpg
    SpaceX_Demo-2_Launch_(NHQ202005300044).jpg
    Starship_SN8_launch.jpg
    SpaceX_Starship_IFT-4_launch.jpg

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch files and metadata
        env:
          TITLES: |
            ${{ inputs.titles || env.DEFAULT_TITLES }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          titles = [t.strip() for t in os.environ['TITLES'].splitlines() if t.strip()]
          UA = {'User-Agent': 'orbit-splash-fetch/1.0 (GitHub Actions; one-off asset fetch)'}
          os.makedirs('out', exist_ok=True)
          meta = []
          for i, t in enumerate(titles):
              q = urllib.parse.urlencode({
                  'action': 'query', 'titles': 'File:' + t, 'prop': 'imageinfo',
                  'iiprop': 'url|size|extmetadata|sha1', 'format': 'json', 'formatversion': '2'})
              req = urllib.request.Request('https://commons.wikimedia.org/w/api.php?' + q, headers=UA)
              page = json.loads(urllib.request.urlopen(req).read())['query']['pages'][0]
              if page.get('missing') or not page.get('imageinfo'):
                  meta.append({'title': t, 'missing': True}); print('MISSING', t); continue
              ii = page['imageinfo'][0]; ext = ii.get('extmetadata', {})
              g = lambda k: ext.get(k, {}).get('value')
              url = ii['url']
              fn = f"{i:02d}-" + os.path.basename(urllib.parse.unquote(url))
              data = urllib.request.urlopen(urllib.request.Request(url, headers=UA)).read()
              open('out/' + fn, 'wb').write(data)
              meta.append({'title': t, 'file': fn, 'license': g('LicenseShortName'), 'licenseUrl': g('LicenseUrl'),
                           'artist': g('Artist'), 'credit': g('Credit'), 'date': g('DateTimeOriginal'),
                           'width': ii['width'], 'height': ii['height'], 'bytes': len(data),
                           'url': url, 'descriptionurl': ii['descriptionurl'], 'sha1': ii['sha1']})
              print('OK', fn, ii['width'], ii['height'], len(data), g('LicenseShortName'))
          json.dump(meta, open('out/meta.json', 'w'), indent=2)
          PY
      - name: Push to orphan branch
        env:
          BRANCH: ${{ inputs.branch || 'assets/splash-candidates' }}
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q
          git checkout -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Commons asset candidates"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
