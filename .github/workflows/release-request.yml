# Publish a release without touching git tags: bump "version" in package.json,
# write the same version on the first line of RELEASE, commit and push (any
# branch). This hands off to release.yml, which builds the bundle and the Mac
# app, creates the v<version> tag at this commit and publishes the GitHub
# Release. `npm version patch && git push --follow-tags` still works as well.
name: Release (RELEASE file)

on:
  push:
    paths: ['RELEASE']

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
