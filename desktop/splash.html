<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>ORBIT</title>
    <style>
      @font-face {
        font-family: 'Saira';
        src: url('./splash/saira-var.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000208;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        position: relative;
        font-family: 'Saira', system-ui, sans-serif;
        color: #e6eefb;
        opacity: 1;
        transition: opacity 320ms ease;
        -webkit-app-region: drag;
      }
      body.out {
        opacity: 0;
      }
      /* Painted under the photo so a missing splash.jpg still gives a finished dark frame. */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 85% 10%, rgba(38, 72, 128, 0.55) 0%, rgba(0, 2, 8, 0) 60%),
          radial-gradient(90% 70% at 10% 95%, rgba(77, 155, 255, 0.22) 0%, rgba(0, 2, 8, 0) 60%),
          linear-gradient(160deg, #050b1c 0%, #000208 60%, #000104 100%);
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        animation: zoom 9s ease-out forwards;
      }
      .photo.missing {
        display: none;
      }
      @keyframes zoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.06);
        }
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          38deg,
          rgba(0, 2, 8, 0.96) 0%,
          rgba(0, 2, 8, 0.78) 28%,
          rgba(0, 2, 8, 0.28) 55%,
          rgba(0, 2, 8, 0) 78%
        );
      }
      .brand {
        position: absolute;
        left: 40px;
        bottom: 38px;
      }
      .wordmark {
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.18em;
        line-height: 1;
        color: #f4f7fd;
      }
      .tagline {
        margin-top: 8px;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: #6b8bb0;
      }
      .rail {
        position: relative;
        width: 220px;
        height: 2px;
        margin-top: 22px;
        background: rgba(107, 139, 176, 0.25);
        border-radius: 1px;
        overflow: hidden;
      }
      .sweep {
        position: absolute;
        top: 0;
        left: 0;
        width: 34%;
        height: 100%;
        background: linear-gradient(90deg, rgba(77, 155, 255, 0) 0%, #4d9bff 50%, rgba(77, 155, 255, 0) 100%);
        animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      body.error .sweep {
        animation: none;
        width: 100%;
        background: #f4614e;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #9fb3cf;
        max-width: 420px;
        line-height: 1.45;
      }
      body.error .status {
        color: #f4614e;
      }
      .meta {
        position: absolute;
        right: 22px;
        bottom: 18px;
        text-align: right;
        font-size: 10px;
        letter-spacing: 0.08em;
        line-height: 1.6;
        color: #e6eefb;
        opacity: 0.55;
        font-variant-numeric: tabular-nums;
      }
      .meta .credit:empty {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .photo,
        .sweep {
          animation: none;
        }
        .sweep {
          width: 100%;
          opacity: 0.6;
        }
        body {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <img class="photo" id="photo" src="./splash/splash.jpg" alt="" draggable="false" />
    <div class="scrim"></div>
    <div class="brand">
      <div class="wordmark">ORBIT</div>
      <div class="tagline">GNC FLIGHT ACADEMY</div>
      <div class="rail"><div class="sweep"></div></div>
      <div class="status" id="status">Loading curriculum…</div>
    </div>
    <div class="meta">
      <div class="version" id="version"></div>
      <div class="credit" id="credit"></div>
    </div>
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        var shell = params.get('shell') || ''
        var bundle = params.get('bundle') || ''
        var credit = params.get('credit') || ''
        var statusEl = document.getElementById('status')
        document.getElementById('version').textContent =
          (shell ? 'v' + shell : '') + (shell && bundle ? ' · ' : '') + (bundle ? 'bundle ' + bundle : '')
        document.getElementById('credit').textContent = credit

        var photo = document.getElementById('photo')
        photo.addEventListener('error', function () {
          photo.classList.add('missing')
        })
        if (photo.complete && photo.naturalWidth === 0) photo.classList.add('missing')

        window.orbitSplash = {
          status: function (text) {
            document.body.classList.remove('error')
            statusEl.textContent = String(text == null ? '' : text)
          },
          error: function (text) {
            document.body.classList.add('error')
            statusEl.textContent = String(text == null ? '' : text)
          },
          out: function () {
            document.body.classList.add('out')
          },
        }
      })()
    </script>
  </body>
</html>
